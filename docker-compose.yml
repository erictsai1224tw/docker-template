services:
  # ── 單一 container，個人設定透過 .env 傳入 ───────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    runtime: nvidia
    shm_size: '64gb'
    ports:
      - "8888"
      - "6006"
      - "8080"
      - "3000"
      - "5000"
      - "8000"
      - "9000"
      - "6379"
    volumes:
    - .:/app
    - ${HOME}/.ssh:/.ssh
    # - ../DATASET:/app/DATASET/DATA3
    # - ../DATA5_DATASET:/app/DATASET/DATA5
    # - ../DATA5_DATASET/SPAD_PHOTO:/app/SPAD_PHOTO
    # - /home/user/DATA_SERVER/DISK_1_2/SPAD_PHOTO:/app/SPAD_PHOTO2
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-}
      - TZ=Asia/Taipei
      - GIT_NAME=${GIT_NAME:-}
      - GIT_EMAIL=${GIT_EMAIL:-}
      - COLORTERM=truecolor
    stdin_open: true
    tty: true
