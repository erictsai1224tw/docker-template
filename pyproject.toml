[project]
name = "my-project"
version = "0.1.0"
description = "A short description of your project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Add your runtime dependencies here.
    # Remove or replace these examples as needed:
    "numpy",
    "matplotlib",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle, pyflakes, isort

[tool.uv]
# Treat this as a virtual project — only install dependencies, not the project itself.
# Remove this section if you want uv to install your package (requires a src/ layout).
package = false
